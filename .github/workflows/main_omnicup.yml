# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
# More info on Python, GitHub Actions, and Azure App Service: https://aka.ms/python-webapps-actions

name: Build and deploy Python app to Azure Web App - OmniCUP

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # IMPORTANT: Pull Git LFS files (your models are very likely stored in LFS)
      - name: Checkout repository (with Git LFS)
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Ensure Git LFS objects are present
        run: |
          git lfs install
          git lfs pull
          git lfs ls-files || true

      # Optional but strongly recommended: fail fast if model files are still LFS pointers
      - name: Validate model files are not LFS pointer files
        run: |
          set -e
          check_pointer () {
            f="$1"
            if [ -f "$f" ]; then
              first_line="$(head -n 1 "$f" || true)"
              echo "First line of $f: $first_line"
              if echo "$first_line" | grep -qi "^version https://git-lfs.github.com/spec/v1"; then
                echo "ERROR: $f is a Git LFS pointer file, not the real binary."
                echo "Fix: ensure the file is tracked by LFS and that LFS is pulled during checkout."
                exit 1
              fi
            else
              echo "WARNING: $f not found in repo root at build time."
            fi
          }

          # Adjust names if your repo uses different paths
          check_pointer "xgb_model.json"
          check_pointer "mlp_model.pt"
          check_pointer "ensemble_info.pkl"
          check_pointer "label_encoder.pkl"

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # OPTIONAL: Keep this only if you want to catch dependency issues in CI.
      # If your requirements.txt is still being fixed, you can remove this section.
      - name: Install dependencies (CI validation)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            .
            !antenv/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_BC925BFF1C4F4B1BAB342A2A186FAFFD }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_489DCC1FC2EA4DADBC58734E62F2AC71 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_A533C0ABC23D47FB8A057691CCA4D82E }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: "OmniCUP"
          slot-name: "Production"
          package: .
